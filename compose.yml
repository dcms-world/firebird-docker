services:
  firebird:
    image: firebird-local:3.0.1
    platform: linux/amd64
    build: .
    environment:
      SYSDBAPASS: ${SYSDBAPASS:?Set SYSDBAPASS for Firebird 3.0.1}
    ports:
      - '127.0.0.1:${FIREBIRD_HOST_PORT:-3050}:3050'
      - '127.0.0.1:${FIREBIRD_HOST_AUX_PORT:-3051}:3051'
    volumes:
      - firebird301-data:/db

volumes:
  firebird301-data:
