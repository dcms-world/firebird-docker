name: Firebird 4 release
on:
  pull_request:
    paths:
      - '.github/workflows/firebird-4.0.7.yml'
      - 'images/4.0.*/**'
      - 'images/3.0.1/**'
      - 'images/3.0.2/**'
      - 'images/3.0.14/**'
      - 'images/5.0.4/**'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the exact version tag to Docker Hub after the SQL test'
        type: boolean
        default: false
      backfill:
        description: 'Select 4.0.1, 4.0.4, 4.0.5 and 4.0.6 instead of 4.0.7'
        type: boolean
        default: false
      legacy3:
        description: 'Select the historical Firebird 3.0.1 and 3.0.2 images'
        type: boolean
        default: false

      firebird3014:
        description: 'Select the Firebird 3.0.14 image'
        type: boolean
        default: false

      firebird504:
        description: 'Select the Firebird 5.0.4 image'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dockerhub-firebird-docker-4.0.7
  cancel-in-progress: false

jobs:
  build-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(github.event_name == 'pull_request' && '["3.0.1","3.0.2","3.0.14","4.0.1","4.0.4","4.0.5","4.0.6","5.0.4"]' || inputs.firebird504 && '["5.0.4"]' || inputs.firebird3014 && '["3.0.14"]' || inputs.legacy3 && '["3.0.1","3.0.2"]' || inputs.backfill && '["4.0.1","4.0.4","4.0.5","4.0.6"]' || '["4.0.7"]') }}
    env:
      VERSION: ${{ matrix.version }}
      IMAGE: dcms/firebird-docker:${{ matrix.version }}
      TAG_URL: https://hub.docker.com/v2/repositories/dcms/firebird-docker/tags/${{ matrix.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build exact version
        run: docker build --pull --tag "$IMAGE" "images/$VERSION"
      - name: Verify SQL over the published container port
        run: bash "images/$VERSION/smoke.sh" "$IMAGE"
      - name: Publish only if the tag does not exist
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.repository == 'dcms-world/firebird-docker' && (github.ref == 'refs/heads/master' || (github.ref == 'refs/heads/release/firebird-5.0.4' && inputs.firebird504))
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKER_CONFIG: ${{ runner.temp }}/firebird-docker-config
        run: |
          set -euo pipefail
          : "${DOCKERHUB_USERNAME:?Set the Docker Hub username in Actions variables}"
          : "${DOCKERHUB_TOKEN:?Set the Docker Hub token in Actions secrets}"
          umask 077
          mkdir -p "$DOCKER_CONFIG"
          trap 'docker logout >/dev/null 2>&1 || true' EXIT
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          status=$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' "$TAG_URL")
          case "$status" in
            200) echo 'Exact tag already exists. Nothing published.'; exit 0 ;;
            404) ;;
            *) echo "Cannot establish whether the tag exists (HTTP $status)" >&2; exit 1 ;;
          esac
          docker push "$IMAGE" | tee "$RUNNER_TEMP/firebird-push.log"
          expected=$(awk '/digest: sha256:/ { for (i=1;i<NF;i++) if ($i=="digest:") print $(i+1) }' "$RUNNER_TEMP/firebird-push.log")
          [[ $expected =~ ^sha256:[0-9a-f]{64}$ ]]
          for attempt in {1..10}; do
            if actual=$(curl -fsS --max-time 15 "$TAG_URL" | jq -er '.digest'); then
              [[ $actual == "$expected" ]] || { echo "Digest mismatch: $actual != $expected" >&2; exit 1; }
              echo "Verified $IMAGE at $actual"
              exit 0
            fi
            sleep 3
          done
          echo 'Push returned success, but Docker Hub read-back could not be verified.' >&2
          exit 1
