services:
  firebird:
    image: firebird-local:4.0.7
    platform: linux/amd64
    build: .
    environment:
      SYSDBAPASS: ${SYSDBAPASS:?Set SYSDBAPASS for Firebird 4.0.7}
    ports:
      - '127.0.0.1:${FIREBIRD_HOST_PORT:-3050}:3050'
      - '127.0.0.1:${FIREBIRD_HOST_AUX_PORT:-3051}:3051'
    volumes:
      - firebird407-data:/db

volumes:
  firebird407-data:
